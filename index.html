<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ff8c69" />
    <meta
      name="description"
      content="Louise Can't Sit Still — a cozy Orange County adventure for someone who is always on the go."
    />
    <title>Louise Can't Sit Still</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <canvas id="game" aria-label="Louise Can't Sit Still game canvas"></canvas>
      <div id="hud"></div>
      <div id="joystick" class="joystick hidden" aria-hidden="true">
        <div class="joystick-base"></div>
        <div class="joystick-stick"></div>
      </div>
      <div id="overlay" class="overlay hidden"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
