<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2b1d2e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="Louise Can't Sit Still — a cozy 3D Orange County day for someone who is always on the go." />
    <meta property="og:title" content="Louise Can't Sit Still" />
    <meta property="og:description" content="One restless day in Orange County. Keep her moving." />
    <title>Louise Can't Sit Still</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600;1,9..144,800&family=Fredoka:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app">
      <canvas id="scene" aria-label="Louise Can't Sit Still — 3D game view"></canvas>
      <div id="vignette"></div>
      <div id="labels"></div>
      <div id="hud" class="hidden">
        <div class="hud-top">
          <div class="meter-card" id="meter-card">
            <img class="meter-face" src="portraits/louise.webp" alt="" />
            <div class="meter-body">
              <div class="meter-row">
                <span class="meter-label">Restless</span>
                <span class="hearts" id="hearts-wrap"><i class="heart"></i><b id="hearts">0</b></span>
              </div>
              <div class="meter"><div class="meter-ghost" id="meter-ghost"></div><div class="meter-fill" id="meter-fill"></div></div>
            </div>
          </div>
          <div class="hud-buttons">
            <button id="btn-map" class="icon-btn" aria-label="Day map"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Zm0 2.2 6 2v11.6l-6-2V6.2Z" /></svg></button>
            <button id="btn-mute" class="icon-btn" aria-label="Toggle sound"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4Z" /></svg></button>
            <button id="btn-pause" class="icon-btn" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z" /></svg></button>
          </div>
        </div>
        <div class="chapter-chip" id="chapter-chip"><span class="time"></span><span class="place"></span></div>
        <div class="objective" id="objective"></div>
      </div>
      <div id="edge-arrow"><svg viewBox="0 0 24 24"><path d="M4 12h12l-5-5 1.4-1.4L20 13l-7.6 7.4L11 19l5-5H4z" /></svg></div>
      <button id="prompt" class="hidden" type="button"></button>
      <div id="coach" class="hidden"></div>
      <div id="toasts"></div>
      <div id="joystick"><div class="joystick-ring"></div><div class="joystick-knob"></div></div>
      <div id="stage" class="hidden"></div>
      <div id="dialog" class="hidden"></div>
      <div id="screens"></div>
      <div id="fade" class="on"><div class="loader"><span></span><span></span><span></span></div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
